<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0f1e">
  <title>Traders Insight - Read The Signal</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/nav.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="/js/auth.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 120px auto 40px;
      padding: 0 20px;
    }

    /* Header */
    .header {
      margin-bottom: 40px;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .header-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .header-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 8px;
    }

    .header-tabs {
      display: flex;
      gap: 8px;
    }

    .tab-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      background: var(--bg-card);
      color: var(--text-primary);
      border-color: var(--border-color);
    }

    .tab-btn.active {
      background: var(--bg-card);
      color: var(--text-primary);
      border-color: var(--border-color);
    }

    /* Stats Section */
    .stats-section {
      margin-bottom: 32px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }

    .stat-item {
      text-align: center;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .stat-value.green {
      color: var(--green);
    }

    .stat-value.red {
      color: var(--red);
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .header-tabs {
        display: none;
      }
    }

    /* Card */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-color);
    }

    .card-header {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    /* Donut Chart with Badges */
    .donut-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      flex-shrink: 0;
    }

    .donut-chart {
      width: 100%;
      height: 100%;
    }

    .donut-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background: var(--bg-card);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
    }

    .donut-badges {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
    }

    .badge {
      position: absolute;
      width: 28px;
      height: 28px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-secondary);
      transform: translate(-50%, -50%);
    }

    /* Card Info */
    .card-info {
      flex: 1;
      min-width: 0;
    }

    .card-name-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 8px;
    }

    .card-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .card-handle {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .card-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-stats {
      display: flex;
      gap: 24px;
    }

    .card-stat {
      display: flex;
      flex-direction: column;
    }

    .card-stat-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .card-stat-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .card-stat-value.green {
      color: var(--green);
    }

    .card-stat-value.red {
      color: var(--red);
    }

    /* Holdings */
    .holdings-wrapper {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }

    .holdings-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      text-align: center;
    }

    .holdings-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 12px;
      justify-content: center;
    }

    .holdings-segment {
      height: 8px;
      border-radius: 4px;
    }

    .holdings-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .holdings-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .holdings-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="nav-bar">
    <div class="nav-container">
      <div class="nav-left">
        <a href="/" class="logo">
          <span class="logo-dot"></span>
          <span class="logo-text">The Signal</span>
        </a>
      </div>
      <div class="nav-right">
        <button class="nav-btn" onclick="window.location='/portfolio'">Portfolio</button>
        <button class="nav-btn" onclick="window.location='/signals'">Signals</button>
        <button class="nav-btn" onclick="window.location='/news'">News</button>
        <button class="nav-btn auth-btn" onclick="window.location='/profile'">
          <span class="auth-icon">👤</span>
          <span class="auth-text">Sign In</span>
        </button>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="header">
      <div class="header-content">
        <div>
          <h1 class="header-title">Traders Insight</h1>
          <p class="header-subtitle">Track elite investors in real-time. See what pro traders are investing in and portfolio changes.</p>
        </div>
        <div class="header-tabs" id="headerTabs">
          <button class="tab-btn active" data-tab="top-investors">Top Investors</button>
          <button class="tab-btn" data-tab="top-performers">Top Performers</button>
          <button class="tab-btn" data-tab="recent-changes">Recent Changes</button>
        </div>
      </div>
    </div>

    <!-- Stats Section -->
    <div class="stats-section">
      <div class="stats-grid">
        <div class="stat-item">
          <div class="stat-value">4</div>
          <div class="stat-label">Tracked Traders</div>
        </div>
        <div class="stat-item">
          <div class="stat-value green">+144.3%</div>
          <div class="stat-label">Best 250D Return</div>
        </div>
        <div class="stat-item">
          <div class="stat-value red">-8.2%</div>
          <div class="stat-label">Worst 250D Return</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">$87.2B</div>
          <div class="stat-label">Total Value Tracked</div>
        </div>
      </div>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <script>
    const investors = [
      {
        name: "Leopold's Portfolio",
        handle: "@leopold",
        desc: "AI Infrastructure focused portfolio tracking elite compute and energy holdings",
        ret: "+144.83%",
        hold: "10",
        date: "Jul 1",
        weights: [
          {c: "#fbbf24", v: 28.81, label: "NBIS"},
          {c: "#ef4444", v: 19.51, label: "SNDK"},
          {c: "#22c55e", v: 14.82, label: "BE"},
          {c: "#3b82f6", v: 9.44, label: "CORZ"},
          {c: "#a855f7", v: 8.15, label: "CRWV"},
          {c: "#06b6d4", v: 6.22, label: "IREN"},
          {c: "#f97316", v: 5.31, label: "APLD"},
          {c: "#eab308", v: 3.88, label: "SHAZ"}
        ]
      },
      {
        name: "Buffett Holdings",
        handle: "@buffett",
        desc: "Berkshire Hathaway tracking - value investing focused",
        ret: "+24.13%",
        hold: "7",
        date: "Apr 30",
        weights: [
          {c: "#6aa9e0", v: 35.12, label: "AAPL"},
          {c: "#1e3a5a", v: 14.98, label: "GOOGL"},
          {c: "#1a3a5c", v: 14.21, label: "BAC"},
          {c: "#0f2a4a", v: 11.85, label: "AXP"},
          {c: "#123456", v: 10.02, label: "KO"},
          {c: "#2a4a6c", v: 8.09, label: "CVX"},
          {c: "#3a5a7c", v: 5.73, label: "WFC"}
        ]
      },
      {
        name: "Pelosi Holdings",
        handle: "@pelosi",
        desc: "Congress portfolio tracking - tech focused",
        ret: "+45.2%",
        hold: "7",
        date: "Jun 15",
        weights: [
          {c: "#8bc34a", v: 30.15, label: "NVDA"},
          {c: "#90caf9", v: 18.23, label: "AAPL"},
          {c: "#1976d2", v: 14.08, label: "MSFT"},
          {c: "#4caf50", v: 12.01, label: "GOOGL"},
          {c: "#ff9800", v: 10.05, label: "AMZN"},
          {c: "#f44336", v: 8.24, label: "AVGO"},
          {c: "#b71c1c", v: 7.24, label: "CRWD"}
        ]
      },
      {
        name: "Cathie Wood",
        handle: "@cathie",
        desc: "ARKK innovation focused - disruptive tech",
        ret: "+18.4%",
        hold: "12",
        date: "Jun 10",
        weights: [
          {c: "#ff6b6b", v: 22.15, label: "TSLA"},
          {c: "#4ecdc4", v: 15.28, label: "COIN"},
          {c: "#45b7d1", v: 12.45, label: "ROKU"},
          {c: "#96ceb4", v: 10.32, label: "CRSP"},
          {c: "#feca57", v: 9.18, label: "PLTR"}
        ]
      },
    ];

    // Tab switching
    document.getElementById('headerTabs').addEventListener('click', (e) => {
      if (e.target.classList.contains('tab-btn')) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        // Here you could fetch different data based on tab
        const tab = e.target.dataset.tab;
        console.log('Switched to tab:', tab);
      }
    });

    function donutGradient(weights) {
      let acc = 0;
      const gradient = weights.map(w => {
        const s = `${w.c} ${acc}% ${acc + w.v}%`;
        acc += w.v;
        return s;
      }).join(',');
      return `conic-gradient(${gradient})`;
    }

    function generateCard(inv) {
      const badges = inv.weights.map((w, i) => {
        const angle = (i * 360 / inv.weights.length - 90) * Math.PI / 180;
        const radius = 52;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        return `<div class="badge" data-color="${w.c}" style="left: ${x}px; top: ${y}px; background: ${w.c}; color: white;">${w.label}</div>`;
      }).join('');

      const retClass = inv.ret.startsWith('+') ? 'green' : 'red';
      
      const holdingsBar = inv.weights.slice(0, 6).map(w => {
        return `<div class="holdings-segment" style="background: ${w.c}; width: ${w.v}%;"></div>`;
      }).join('');

      const holdingsLegend = inv.weights.map(w => {
        return `<div class="holdings-item">
          <div class="holdings-dot" style="background: ${w.c};"></div>
          <span>${w.label} ${w.v.toFixed(1)}%</span>
        </div>`;
      }).join('');

      return `
        <div class="card" data-ticker="${inv.name.split(' ')[0].toLowerCase()}">
          <div class="card-header">
            <div class="donut-wrapper">
              <div class="donut-chart" style="background: ${donutGradient(inv.weights)}; border-radius: 50%;"></div>
              <div class="donut-center">${inv.name[0]}</div>
              <div class="donut-badges">
                ${badges}
              </div>
            </div>
            <div class="card-info">
              <div class="card-name-row">
                <div class="card-name">${inv.name}</div>
                <div class="card-handle">${inv.handle}</div>
              </div>
              <div class="card-desc">${inv.desc}</div>
              <div class="card-stats">
                <div class="card-stat">
                  <div class="card-stat-label">Return 250</div>
                  <div class="card-stat-value ${retClass}">${inv.ret}</div>
                </div>
                <div class="card-stat">
                  <div class="card-stat-label">Holdings</div>
                  <div class="card-stat-value">${inv.hold}</div>
                </div>
                <div class="card-stat">
                  <div class="card-stat-label">Last Update</div>
                  <div class="card-stat-value">${inv.date}</div>
                </div>
              </div>
            </div>
          </div>
          <div class="holdings-wrapper">
            <div class="holdings-title">Top Holdings</div>
            <div class="holdings-bar">
              ${holdingsBar}
            </div>
            <div class="holdings-legend">
              ${holdingsLegend}
            </div>
          </div>
        </div>
      `;
    }

    const grid = document.getElementById('grid');
    grid.innerHTML = investors.map(inv => generateCard(inv)).join('');
  </script>
</body>
</html>
